<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAT English Learning Studio 2026 V6</title>
<style>
:root{
  --navy:#16324F; --navy2:#1E3A5F; --blue:#DBEAFE; --sky:#E0F2FE;
  --pink:#FCE7F3; --purple:#EDE9FE; --yellow:#FEF3C7; --mint:#ECFDF5;
  --green:#D1FAE5; --bg:#F8FAFC; --line:#D8E0E8; --text:#111827;
  --muted:#6B7280; --white:#FFFFFF; --danger:#B91C1C; --success:#0F766E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
header{background:linear-gradient(135deg,var(--navy),#244B70);color:white;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 3px 14px rgba(22,50,79,.22)}
.brand h1{font-size:22px;margin:0 0 4px;letter-spacing:.2px}.brand p{margin:0;opacity:.82;font-size:13px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:700;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--navy);color:white}
.btn-light{background:white;color:var(--navy)}
.btn-soft{background:#EEF2F7;color:var(--navy);border-color:#D8E0E8}
.btn-danger{background:#FEE2E2;color:#991B1B}
main{padding:18px;max-width:1680px;margin:auto}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
.status{font-size:13px;color:var(--muted)}
.workspace{display:grid;grid-template-columns:minmax(320px,42%) minmax(460px,58%);gap:16px;align-items:start}
.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(15,23,42,.06);overflow:hidden}
.panel-head{padding:14px 16px;background:#F3F4F6;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.panel-head h2{font-size:16px;margin:0;color:var(--navy)}
.panel-body{padding:16px}
.field{margin-bottom:13px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px;color:#374151}
.input,textarea,select{width:100%;border:1px solid #CBD5E1;border-radius:10px;background:white;padding:10px 12px;outline:none}
.input:focus,textarea:focus,select:focus{border-color:#4F83B5;box-shadow:0 0 0 3px rgba(79,131,181,.15)}
textarea{min-height:480px;resize:vertical;line-height:1.65}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.input-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:#F8FAFC}
.tab{border:none;border-radius:9px;padding:8px 11px;background:#E5E7EB;color:#374151;font-weight:800;font-size:13px}
.tab.active{background:var(--navy);color:white}
.result{padding:16px;min-height:610px;max-height:760px;overflow:auto}
.empty{height:560px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{border-radius:12px;padding:13px;border:1px solid rgba(0,0,0,.06)}
.stat strong{font-size:22px;display:block;color:var(--navy)}.stat span{font-size:12px;color:#4B5563}
.c-blue{background:var(--blue)}.c-pink{background:var(--pink)}.c-purple{background:var(--purple)}.c-yellow{background:var(--yellow)}.c-mint{background:var(--mint)}
.card{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:12px;background:white}
.card h3{font-size:15px;color:var(--navy);margin:0 0 10px}
.bilingual{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sentence{padding:10px 0;border-bottom:1px dashed #D1D5DB}.sentence:last-child{border-bottom:none}
/* Milestone 2 Dev Task 8 — see docs/milestones/milestone-02/02-ARCHITECTURE.md §8's <style> block
   row: ".sentence.loading" (skeleton/spinner treatment) and ".sentence.error" (warning-colored
   variant + retry button styling), following the existing c-blue/c-pink/c-mint card-color
   convention (reusing the --sky token already defined for the loading state's background and the
   --danger token already defined in :root for the error state's accent, rather than introducing
   new color values). translationRowTemplate (Dev Task 4) already emits class="sentence loading"
   and class="sentence error" — this is a pure CSS addition, no JS/template change needed. */
.sentence.loading{background:var(--sky);border-radius:9px;padding:12px 14px;margin:4px 0;border-bottom:none;animation:sentencePulse 1.4s ease-in-out infinite}
.sentence.loading .ko{color:var(--navy2)}
@keyframes sentencePulse{0%,100%{opacity:1}50%{opacity:.5}}
.sentence.error{background:rgba(185,28,28,.06);border-left:3px solid var(--danger);border-radius:9px;padding:12px 14px;margin:4px 0;border-bottom:none}
.sentence.error .ko{color:var(--danger);font-weight:700}
.sentence.error .btn{margin-top:8px}
.en{font-weight:650;line-height:1.55}.ko{color:#475569;line-height:1.55;margin-top:5px}
.word-card{display:grid;grid-template-columns:110px 105px 1fr;gap:18px;align-items:start}
.word-card>div:last-child{line-height:1.8}.word-card b{display:inline-block;margin-top:3px;margin-right:7px}.meaning-block{margin:10px 0 14px;padding:10px 12px;border-radius:9px;background:#F8FAFC}.meaning-block+.meaning-block{margin-top:14px}
.level{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;text-align:center}
.l9{background:var(--green)}.l10{background:var(--sky)}.l11{background:var(--yellow)}.l12{background:var(--pink)}
.word{font-weight:900;color:var(--navy);font-size:18px}.pron-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px}.ipa{font-family:Georgia,"Times New Roman",serif;font-size:15px;color:#475569;font-weight:600}.speak-btn{border:1px solid #B8C7D8;background:#EFF6FF;color:#173B63;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}.speak-btn:hover{background:#DBEAFE}.evaluation-strip{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:stretch;margin-top:14px}.evaluation-score{display:flex;align-items:center;justify-content:center;min-height:104px;border-radius:12px;background:#EDE9FE;border:1px solid #DDD6FE}.evaluation-notes{min-height:104px;border-radius:12px;background:#FFF7ED;border:1px solid #FED7AA;padding:12px 14px;line-height:1.75}.dialogue-line{padding:13px 15px!important;margin-bottom:11px!important;line-height:1.85}.dialogue-line .ko{margin-top:7px}
.small{font-size:12px;color:var(--muted)}
.example{background:#F8FAFC;border-left:4px solid #93C5FD;padding:9px 11px;margin-top:8px;border-radius:7px}
.dialogue-line{padding:14px 15px;border-radius:10px;margin-bottom:13px;line-height:1.8}.a{background:var(--blue)}.b{background:var(--mint)}
.phrase-card{line-height:1.95;padding:18px}.phrase-card h3{font-size:23px;line-height:1.35;margin-bottom:16px;color:var(--navy);letter-spacing:.1px}.phrase-card .meaning-block{background:rgba(255,255,255,.72);padding:13px 15px;margin:14px 0 18px}.phrase-label{font-size:14px;color:#475569;font-weight:800}.syn-ant{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.syn-ant>div{padding:11px 13px;border-radius:9px;line-height:1.65}.syn{background:#ECFDF5}.ant{background:#FFF1F2}.example-title{font-size:13px;font-weight:900;color:#334155;margin-bottom:7px}
.grammar-sentence{font-size:17px;line-height:2;padding:13px 14px;background:#F8FAFC;border-radius:10px;margin-bottom:12px}
.g-subject{background:#DBEAFE;border-bottom:2px solid #60A5FA;padding:1px 3px;border-radius:4px}.g-verb{color:#9F3A47;background:#FDECEF;border-bottom:2px solid #D9828E;padding:1px 3px;border-radius:4px;font-weight:850}.g-clause{background:#EDE9FE;border-bottom:2px solid #A78BFA;padding:1px 3px;border-radius:4px}.g-link{color:#8A3C47;background:#FCE7F3;padding:1px 4px;border-radius:4px;font-weight:800}.grammar-note{line-height:1.8;margin-top:10px}.important-note{color:#8A3C47;font-weight:800}.record-box{border:1px solid #C7D2FE;background:#F5F7FF;border-radius:13px;padding:15px;margin-top:16px}.record-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.score-badge{display:inline-flex;align-items:center;justify-content:center;min-width:104px;padding:10px 15px;border-radius:999px;background:#EDE9FE;color:#4C1D95;font-size:20px;font-weight:950}.score-scale{margin-top:12px;padding:12px 14px;border-radius:10px;background:#fff;line-height:1.8;color:#475569}.sat-warning{font-size:12px;color:#64748B;margin-top:8px}.translation-loading{padding:12px;background:#EFF6FF;border-radius:10px;color:#1E3A5F;margin-bottom:12px}
.question{border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:14px}
.choice{display:block;padding:9px 10px;margin:7px 0;border:1px solid #D1D5DB;border-radius:9px}
.choice:hover{background:#F8FAFC}.correct{background:#DCFCE7!important;border-color:#86EFAC}.wrong{background:#FEE2E2!important;border-color:#FCA5A5}
.explanation{display:none;background:#F8FAFC;border-radius:9px;padding:10px;margin-top:10px;color:#475569}
.saved-drawer{position:fixed;inset:0 0 0 auto;width:min(480px,92vw);background:white;z-index:30;box-shadow:-10px 0 30px rgba(15,23,42,.25);transform:translateX(105%);transition:.25s;display:flex;flex-direction:column}
.saved-drawer.open{transform:translateX(0)}
.drawer-head{background:var(--navy);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
.drawer-body{padding:14px;overflow:auto}.saved-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.saved-item h4{margin:0 0 5px;color:var(--navy)}.saved-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:20;display:none}.overlay.show{display:block}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:white;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(15px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:translateY(0)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
@media(max-width:980px){.word-card{grid-template-columns:1fr}.evaluation-strip{grid-template-columns:1fr}.syn-ant{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}textarea{min-height:330px}.result{max-height:none}.settings-grid{grid-template-columns:1fr}.bilingual{grid-template-columns:1fr}}
@media print{header,.toolbar,.input-actions,.tabs,.saved-drawer,.overlay,footer{display:none!important}.workspace{display:block}.panel:first-child{display:none}.panel{box-shadow:none;border:none}.result{max-height:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1>SAT English Learning Studio 2026</h1>
    <p>Passage Analysis · Vocabulary · Grammar · ESL · SAT Practice</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-light" onclick="openSaved()">저장 자료</button>
    <button class="btn btn-light" onclick="window.print()">인쇄 / PDF</button>
  </div>
</header>
<main>
  <div class="toolbar">
    <button class="btn btn-soft" onclick="loadSample()">예제 지문 불러오기</button>
    <button class="btn btn-soft" onclick="newPassage()">새 지문</button>
    <span class="spacer"></span>
    <span class="status" id="status">준비됨</span>
  </div>
  <section class="workspace">
    <div class="panel">
      <div class="panel-head"><h2>① 영어 지문 입력</h2><span class="small">왼쪽 입력 → 오른쪽 자동 분석</span></div>
      <div class="panel-body">
        <div class="field"><label>학습자료 제목</label><input id="title" class="input" placeholder="예: The Role of Sleep in Memory"></div>
        <div class="settings-grid">
          <div class="field"><label>학생 학년</label><select id="grade"><option>9학년</option><option>10학년</option><option selected>11학년</option><option>12학년</option></select></div>
          <!-- TODO(Milestone 3 — Dictionary Upgrade): #difficulty is currently read nowhere in analyze()
               or any render function; selecting it has no effect on output. It is intentionally left
               as a visible-but-inert control for Milestone 1 (bug fixes only / no redesign). It should
               become a real input to vocabulary leveling and question difficulty once the dictionary
               upgrade lands. See DEVELOPMENT_PLAN.md, Milestone 3. -->
          <div class="field"><label>분석 난이도</label><select id="difficulty"><option>기본</option><option selected>중급</option><option>고급</option></select></div>
          <div class="field"><label>SAT 문제 수</label><select id="qcount"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
        </div>
        <div class="field"><label>영어 지문</label><textarea id="passage" placeholder="영어 지문을 여기에 붙여 넣으세요."></textarea></div>
        <div class="input-actions">
          <button class="btn btn-primary" id="analyzeBtn" onclick="analyze()">지문 분석하기</button>
          <button class="btn btn-soft" onclick="saveCurrent()">학습자료 저장</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>② 자동 학습 분석</h2><span class="small" id="analysisTitle">아직 분석하지 않았습니다</span></div>
      <div class="tabs">
        <button class="tab active" data-tab="overview">요약</button>
        <button class="tab" data-tab="translation">전체 해석</button>
        <button class="tab" data-tab="vocab">학년별 단어</button>
        <button class="tab" data-tab="examples">예문</button>
        <button class="tab" data-tab="phrases">숙어·구문</button>
        <button class="tab" data-tab="grammar">문법</button>
        <button class="tab" data-tab="esl">ESL 회화</button>
        <button class="tab" data-tab="sat">SAT 문제</button>
      </div>
      <div id="result" class="result"><div class="empty">지문을 입력하고 <b>지문 분석하기</b>를 누르세요.</div></div>
    </div>
  </section>
</main>
<footer>학습용 프로토타입 V6 · 번역·음성평가는 인터넷 및 브라우저 기능에 따라 달라질 수 있습니다.</footer>
</div>
<div class="overlay" id="overlay" onclick="closeSaved()"></div>
<aside class="saved-drawer" id="drawer">
  <div class="drawer-head"><b>저장된 학습자료</b><button class="btn btn-light" onclick="closeSaved()">닫기</button></div>
  <div class="drawer-body">
    <input id="searchSaved" class="input" placeholder="제목 또는 지문 검색" oninput="renderSaved()">
    <div id="savedList" style="margin-top:12px"></div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script>
const ipaMap={
 cyclosporiasis:"/ˌsaɪkloʊspəˈraɪəsɪs/",administration:"/ədˌmɪnəˈstreɪʃən/",administrator:"/ədˈmɪnəstreɪtɚ/",
 spokesperson:"/ˈspoʊkspɝːsən/",dehydration:"/ˌdiːhaɪˈdreɪʃən/",information:"/ˌɪnfɚˈmeɪʃən/",
 identity:"/aɪˈdentəti/",identities:"/aɪˈdentətiz/",underlying:"/ˌʌndɚˈlaɪɪŋ/",impacted:"/ɪmˈpæktɪd/",
 contracted:"/kənˈtræktɪd/",department:"/dɪˈpɑːrtmənt/",provided:"/prəˈvaɪdɪd/",conditions:"/kənˈdɪʃənz/",
 release:"/rɪˈliːs/",according:"/əˈkɔːrdɪŋ/",

 explanation:"/ˌekspləˈneɪʃən/",controversial:"/ˌkɑːntrəˈvɝːʃəl/",influence:"/ˈɪnfluəns/",consequently:"/ˈkɑːnsəkwentli/",
 cognitive:"/ˈkɑːɡnətɪv/",demonstrate:"/ˈdemənstreɪt/",hypothesis:"/haɪˈpɑːθəsɪs/",retain:"/rɪˈteɪn/",

function speakAmerican(word){
 if(!("speechSynthesis" in window)){toast("이 브라우저는 음성 재생을 지원하지 않습니다.");return}
 speechSynthesis.cancel();

const dictionary={
 significant:["adjective","important or large enough to be noticed or to have an effect","중요한, 상당한, 의미 있는","The researchers found a significant difference between the two groups.","연구자들은 두 집단 사이에서 유의미한 차이를 발견했다.","important, substantial, notable","minor, negligible, insignificant"],

 influence:["noun/verb","the capacity to affect a person, event, or outcome","영향, 영향을 주다","Peer expectations can influence whether students speak during a discussion.","또래의 기대는 학생들이 토론 중 발언할지에 영향을 줄 수 있다.","affect, shape, sway","leave unchanged, preserve"],
 consequently:["adverb","as a direct result of what happened previously","그 결과, 따라서","The data set excluded rural schools; consequently, the conclusion was less generalizable.","자료에서 농촌 학교가 제외되었고, 그 결과 결론의 일반화 가능성이 낮아졌다.","therefore, thus, accordingly","nevertheless, however"],

 const lower=sentence.toLowerCase();

  notes.push(["main",`주어는 <b>“Two people in Michigan who had contracted cyclosporiasis”</b> 전체이고, 본동사는 <b>“have died”</b>입니다.`]);
  notes.push(["caution",`<b>“who had contracted cyclosporiasis”</b>는 people을 꾸미는 관계절입니다. 관계절 안의 <b>had contracted</b>와 문장 본동사 <b>have died</b>를 혼동하지 마세요.`]);
  notes.push(["korean",`한국어 학습자는 가까운 동사 <b>had</b>를 본동사로 보기 쉽습니다. 관계절을 괄호로 묶고 “Two people … have died”를 먼저 읽으면 구조가 분명해집니다.`]);

 }

  notes.push(["main",`주어는 <b>“Both people”</b>, 본동사는 <b>“had”</b>입니다. 대시 사이의 <b>“whose identities were not provided”</b>는 삽입된 설명입니다.`]);

  notes.push(["korean",`<b>“that may have been impacted …”</b>는 health conditions를 꾸밉니다. may have been + 과거분사는 ‘영향을 받았을 가능성’을 나타냅니다.`]);
  return notes;
 }

 if(presentPerfect) notes.push(["main",`<b>“${escapeHtml(presentPerfect[0])}”</b>는 현재완료입니다. 과거의 사건을 현재의 결과나 현재 관련성과 연결합니다.`]);
 else if(pastPerfect) notes.push(["main",`<b>“${escapeHtml(pastPerfect[0])}”</b>는 과거완료입니다. 다른 과거 사건보다 먼저 일어난 일을 나타냅니다.`]);
 else {

  if(mainVerb) notes.push(["main",`이 문장의 핵심 동사는 <b>“${escapeHtml(mainVerb[0])}”</b>입니다. 동사 앞의 명사구를 주어로 잡고 먼저 핵심 문장을 읽으세요.`]);
 }

 if(dashRelative) notes.push(["caution",`대시 사이의 <b>“${escapeHtml(dashRelative[0].replaceAll("—","").trim())}”</b>는 없어도 기본 문장이 성립하는 삽입 설명입니다.`]);

 if(modalPassive) notes.push(["korean",`<b>“${escapeHtml(modalPassive[0])}”</b>는 조동사 + 완료 + 수동 구조입니다. ‘~되었을 수도 있다’처럼 가능성을 조심스럽게 표현합니다.`]);

 else if(according) notes.push(["korean",`<b>“according to ${escapeHtml(according[1])}”</b>는 정보의 출처를 나타냅니다. 글쓴이 자신의 주장과 인용된 정보를 구별하세요.`]);

 return notes.slice(0,4);
}

function startAudioMetrics(stream){
 audioMetrics={frames:0,voiced:0,sumRms:0,sumSqRms:0,peak:0};
 try{
  audioContext=new (window.AudioContext||window.webkitAudioContext)();
  const source=audioContext.createMediaStreamSource(stream);
  analyser=audioContext.createAnalyser();analyser.fftSize=1024;source.connect(analyser);
  const data=new Uint8Array(analyser.fftSize);
  metricTimer=setInterval(()=>{
   analyser.getByteTimeDomainData(data);
   let sum=0;
   for(const v of data){const n=(v-128)/128;sum+=n*n}
   const rms=Math.sqrt(sum/data.length);
   audioMetrics.frames++;audioMetrics.sumRms+=rms;audioMetrics.sumSqRms+=rms*rms;audioMetrics.peak=Math.max(audioMetrics.peak,rms);
   if(rms>.018)audioMetrics.voiced++;
  },80);
 }catch(e){}
}
function stopAudioMetrics(){
 if(metricTimer){clearInterval(metricTimer);metricTimer=null}
 if(audioContext){try{audioContext.close()}catch(e){}audioContext=null}
}
async function startRecording(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordedChunks=[];recordingStartedAt=Date.now();recordingDuration=0;speechTranscript="";
  startAudioMetrics(stream);
  mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};
  mediaRecorder.onstop=()=>{
   recordingDuration=Math.max(.1,(Date.now()-recordingStartedAt)/1000);
   stopAudioMetrics();
   const blob=new Blob(recordedChunks,{type:'audio/webm'});recordedUrl=URL.createObjectURL(blob);
   stream.getTracks().forEach(t=>t.stop());
   if(speechRecognition){try{speechRecognition.stop()}catch(e){}}
   const el=document.getElementById('recordStatus');if(el)el.textContent='녹음이 완료되었습니다. 이제 발음 평가를 눌러 주세요.';
  };
  mediaRecorder.start();startSpeechRecognition();
  document.getElementById('recordStatus').textContent='녹음 중입니다… 문장을 자연스럽게 읽어 주세요.';
 }catch(e){
  const el=document.getElementById('recordStatus');if(el)el.textContent='마이크를 사용할 수 없습니다. 브라우저 권한을 확인해 주세요.';
 }
}

}
function evaluatePronunciation(target){
 const scoreBox=document.getElementById('pronScoreBox'),notes=document.getElementById('pronNotes'),transcriptBox=document.getElementById('pronTranscript');
 if(!scoreBox||!notes){toast('ESL 회화 페이지를 다시 열어 주세요.');return}
 if(!recordedUrl){
  scoreBox.innerHTML='<span class="score-badge">— / 10</span>';
  notes.innerHTML='<b>평가할 녹음이 없습니다.</b><br>먼저 녹음 시작을 누르고 문장을 읽은 뒤 녹음 중지를 눌러 주세요.';
  return;
 }
 const clean=s=>(String(s||"").toLowerCase().match(/[a-z']+/g)||[]);
 const t=clean(target),p=clean(speechTranscript);
 const lcs=(a,b)=>{const dp=Array(b.length+1).fill(0);for(let i=1;i<=a.length;i++){let prev=0;for(let j=1;j<=b.length;j++){const tmp=dp[j];dp[j]=a[i-1]===b[j-1]?prev+1:Math.max(dp[j],dp[j-1]);prev=tmp}}return dp[b.length]};
 const sequence=p.length?lcs(t,p)/Math.max(1,t.length):0;
 const coverage=p.length?Math.min(1,p.length/Math.max(1,t.length)):0;
 const expectedSeconds=Math.max(6,t.length/2.25);
 const durationScore=Math.max(0,1-Math.min(1,Math.abs(recordingDuration-expectedSeconds)/(expectedSeconds*.9)));
 const frames=Math.max(1,audioMetrics.frames);
 const avgRms=audioMetrics.sumRms/frames;
 const variance=Math.max(0,audioMetrics.sumSqRms/frames-avgRms*avgRms);
 const voicedRatio=audioMetrics.voiced/frames;
 const audibility=Math.min(1,avgRms/.07);
 const voicePresence=Math.min(1,voicedRatio/.65);
 const dynamics=Math.min(1,Math.sqrt(variance)/.045);
 const audioQuality=.45*audibility+.35*voicePresence+.20*dynamics;
 let score;
 let recognitionUsed=p.length>=Math.max(4,t.length*.18);
 if(recognitionUsed){
   const composite=.62*sequence+.16*coverage+.10*durationScore+.12*audioQuality;
   score=5+5*composite;
 }else{
   const composite=.42*audioQuality+.33*durationScore+.25*voicePresence;
   score=5.5+3.2*composite;
 }
 score=Math.max(5,Math.min(10,Math.round(score*2)/2));
 const missed=recognitionUsed?t.filter((w,i)=>!p.includes(w)).slice(0,7):[];
 const level=score>=9.5?"미국 영어 평균에 매우 가까운 명료도":score>=9?"매우 우수한 명료도":score>=8.5?"우수한 명료도":score>=8?"안정적인 중상급 명료도":score>=7.5?"좋은 중급 명료도":score>=7?"의미 전달이 잘 되는 수준":score>=6.5?"핵심 문장은 전달되는 수준":score>=6?"천천히 읽으면 전달되는 수준":score>=5.5?"단어별 발음 연습이 필요한 수준":"기초 발음 점검이 필요한 수준";
 let cautions=[];
 if(recognitionUsed&&missed.length)cautions.push(`다시 확인할 단어: ${[...new Set(missed)].join(", ")}`);
 if(avgRms<.025)cautions.push("목소리가 작게 녹음되었습니다. 마이크에서 조금 더 가까이 읽어 보세요.");
 if(voicedRatio<.35)cautions.push("침묵 구간이 많았습니다. 문장 사이의 멈춤을 조금 줄여 보세요.");
 if(durationScore<.5)cautions.push("읽기 속도가 목표 문장 길이에 비해 빠르거나 느립니다. 의미 단위로 일정하게 읽어 보세요.");
 if(score<8)cautions.push("내용어에 강세를 주고, 문장 끝 자음과 -s, -ed를 분명히 발음해 보세요.");
 if(score>=8.5)cautions.push("전체적으로 명료합니다. 이제 연결 발음과 억양의 자연스러움을 다듬어 보세요.");
 if(!recognitionUsed)cautions.push("이 브라우저에서는 문자 인식 결과가 충분하지 않아 음량·발화 구간·읽기 속도를 중심으로 평가했습니다.");
 scoreBox.innerHTML=`<span class="score-badge">${score.toFixed(1)} / 10</span>`;
 notes.innerHTML=`<b>${level}</b><br>${cautions.join("<br>")||"전체적으로 안정적인 발음입니다."}<br><span class="small">브라우저 기반 학습용 평가이며 전문 음성학 검사와 동일하지 않습니다.</span>`;
 transcriptBox.textContent=recognitionUsed?`브라우저가 인식한 문장: ${speechTranscript}`:`음성 지표: 발화 구간 ${Math.round(voicedRatio*100)}%, 평균 음량 ${Math.round(audibility*100)}%, 읽기 속도 적합도 ${Math.round(durationScore*100)}%`;
}
function sat(a){return `<div class="card c-pink"><h3>SAT Practice · ${a.questions.length}문제</h3>중급~고급 수준의 중심 생각, 추론, 문장 기능, 근거, 어휘 문맥, 표현의 정확성 문제입니다.<div class="sat-warning">문제·선택지·해설은 영어로만 생성되도록 검증합니다.</div></div>${a.questions.map((q,i)=>`<div class="question" id="q${i}"><div class="small" style="font-weight:900;color:#6D4C7D;margin-bottom:7px">${escapeHtml(q.type||"SAT Reading and Writing")}</div><b>${i+1}. ${escapeHtml(q.q)}</b>${q.choices.map((c,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${escapeHtml(c)}</label>`).join("")}<div class="explanation" id="exp${i}"><b>Explanation:</b> ${escapeHtml(q.why)}</div></div>`).join("")}<button class="btn btn-primary" onclick="gradeQuiz()">채점하기</button>`}
function gradeQuiz(){let score=0;state.analysis.questions.forEach((q,i)=>{const picked=document.querySelector(`input[name=q${i}]:checked`);document.querySelectorAll(`#q${i} .choice`).forEach((el,j)=>{el.classList.remove("correct","wrong");if(j===q.ans)el.classList.add("correct");if(picked&&Number(picked.value)===j&&j!==q.ans)el.classList.add("wrong")});if(picked&&Number(picked.value)===q.ans)score++;document.getElementById(`exp${i}`).style.display="block"});toast(`점수: ${score} / ${state.analysis.questions.length}`)}

function getSavedList(){
 try{
   const raw=localStorage.getItem("satStudioSaved");
   if(!raw)return[];
   const parsed=JSON.parse(raw);
   return Array.isArray(parsed)?parsed:[];
 }catch(e){
   console.warn("저장된 학습자료 데이터를 읽지 못했습니다. 데이터가 손상되었을 수 있어 빈 목록으로 표시합니다.",e);
   return[];
 }
}
// Bug fix SAVE-1 (QA-found, High severity) — see docs/milestones/milestone-02/04-QA-REPORT.md's
// Dev Task 6 QA pass. Milestone 2 Dev Task 6 assigns state.analysis (and calls render()) before
// translations resolve, so saveCurrent() — unmodified since before Milestone 2 — could previously
// persist translations still in their 'loading' shape (ko:null) into localStorage. Reopening such
// a save via loadSaved() rendered a permanently stuck "번역 중…" row: translationRowTemplate only
// renders a retry affordance for status:'error', never for 'loading', so there was no recovery
// path. Fix: block the save entirely while any sentence is still loading, so a 'loading' entry can
// never reach localStorage in the first place. This is the narrowest of the three CEO-approved
// options — it changes only saveCurrent()'s own guard clause, touches no other function, and needs
// no new data shape, so retry behavior (retrySentence/translationRowTemplate), Dev Task 6's
// analyze()/updateTranslationRow(), and old pre-Milestone-2 saved sets are all unaffected.
function saveCurrent(){
 if(!state.analysis){toast("먼저 지문을 분석해 주세요.");return}
 if(state.analysis.translations.some(t=>t.status==="loading")){toast("한글 번역이 진행 중입니다. 번역이 완료된 후 저장해 주세요.");return}
 const list=getSavedList();
 let id=Date.now();
 while(list.some(x=>x.id===id))id++;
 const item={...state.analysis,id};
 list.unshift(item);localStorage.setItem("satStudioSaved",JSON.stringify(list));toast("학습자료를 저장했습니다.");
}
function openSaved(){document.getElementById("drawer").classList.add("open");document.getElementById("overlay").classList.add("show");renderSaved()}
function closeSaved(){document.getElementById("drawer").classList.remove("open");document.getElementById("overlay").classList.remove("show")}
function renderSaved(){
 const q=(document.getElementById("searchSaved").value||"").toLowerCase();
 const list=getSavedList().filter(x=>(x.title+" "+x.text).toLowerCase().includes(q));
 document.getElementById("savedList").innerHTML=list.length?list.map(x=>`<div class="saved-item"><h4>${escapeHtml(x.title)}</h4><div class="saved-meta">${escapeHtml(x.grade)} · ${escapeHtml(x.date)} · 어휘 ${x.vocab.length}개 · 문제 ${x.questions.length}개</div><button class="btn btn-soft" onclick="loadSaved(${x.id})">열기</button> <button class="btn btn-danger" onclick="deleteSaved(${x.id})">삭제</button></div>`).join(""):"<div class='empty' style='height:240px'>저장된 자료가 없습니다.</div>";
}
// Milestone 2 Dev Task 7 — see docs/milestones/milestone-02/02-ARCHITECTURE.md §8's loadSaved()
// row. Defensive read: saved sets from before this milestone have translations entries shaped
// only as {en,ko}, with no status field at all — translationRowTemplate (Dev Task 4/5) branches
// on x.status, so a missing field must default to 'success' (matches those older entries' actual
// meaning: they always held a real, already-resolved ko string) rather than being left undefined.
// Matches CODING_STANDARDS.md's "handle localStorage reads defensively" rule. This only patches
// the in-memory object used for this render — it does not rewrite localStorage, so the saved data
// on disk is left exactly as it was.
function loadSaved(id){
 const list=getSavedList(),x=list.find(v=>v.id===id);if(!x)return;
 if(Array.isArray(x.translations))x.translations=x.translations.map(t=>t&&t.status?t:{...t,status:"success"});
 state.analysis=x;document.getElementById("title").value=x.title;document.getElementById("passage").value=x.text;document.getElementById("grade").value=x.grade;document.getElementById("analysisTitle").textContent=x.title;closeSaved();render();toast("저장된 학습자료를 열었습니다.");
}
function deleteSaved(id){
 let list=getSavedList();
 const item=list.find(x=>x.id===id);
 const label=item?item.title||"제목 없는 학습자료":"이 학습자료";
 if(!confirm(`"${label}"를(을) 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.`))return;
 list=list.filter(x=>x.id!==id);localStorage.setItem("satStudioSaved",JSON.stringify(list));renderSaved()
}
function newPassage(){
 const titleVal=document.getElementById("title").value.trim();
 const passageVal=document.getElementById("passage").value.trim();
 const hasUnsavedContent=Boolean(titleVal||passageVal||state.analysis);
 if(hasUnsavedContent&&!confirm("저장하지 않은 제목·지문·분석 결과가 모두 사라집니다. 새 지문을 시작하시겠습니까?"))return;
 document.getElementById("title").value="";document.getElementById("passage").value="";state.analysis=null;document.getElementById("analysisTitle").textContent="아직 분석하지 않았습니다";render()
}
function loadSample(){
 document.getElementById("title").value="The Role of Sleep in Memory";
 document.getElementById("passage").value="Many researchers have questioned the traditional explanation of how memory works. Recent studies demonstrate that sleep may play a significant role in helping students retain new information. In one experiment, students who slept after studying performed better than those who remained awake. Consequently, researchers concluded that sleep can influence cognitive performance. In contrast, stress and poor sleep habits may account for weaker results.";
 toast("예제 지문을 불러왔습니다.");
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
